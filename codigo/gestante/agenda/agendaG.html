<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Consultas e Exames</title>
  <link rel="stylesheet" href="agendaG.css">
</head>
<body>

<header class="top-bar">
  <div class="header-content">
    <h1>Consultas e Exames</h1>
    <nav>
      <a href="/codigo/gestante/portalG.html">Portal Gestante</a>
      <a href="/codigo/home/home.html">Home</a>
    </nav>
  </div>
</header>

<main class="main-container">

  <aside class="left-panel">
    <div class="legend-area">
      <div class="legend-item">
        <span class="dot consulta"></span> Consultas
      </div>
      <div class="legend-item">
        <span class="dot exame"></span> Exames
      </div>
    </div>

    <hr class="divider">

    <h3 id="tituloLista">Agenda do Dia</h3>
    <div id="listaAgendamentos" class="appointments-list">
      <p>Selecione um dia no calendário</p>
    </div>

    <p class="footer-note">
      Nota: O tempo de tolerância para atrasos é de 10 min.
    </p>
  </aside>

  <section class="calendar-panel">
    <div class="calendar-header">
      <button id="prev">&#10094;</button>
      <h2 id="mesAno"></h2>
      <button id="next">&#10095;</button>
    </div>

    <div class="weekdays-grid">
      <div>DOM</div>
      <div>SEG</div>
      <div>TER</div>
      <div>QUA</div>
      <div>QUI</div>
      <div>SEX</div>
      <div>SÁB</div>
    </div>

    <div id="calendarGrid" class="days-grid"></div>
  </section>

</main>

<footer class="bottom-bar">
  <p>www.portalmamae.com.br © 2025</p>
</footer>

<script src="agendaG.js"></script>
</body>
</html>
