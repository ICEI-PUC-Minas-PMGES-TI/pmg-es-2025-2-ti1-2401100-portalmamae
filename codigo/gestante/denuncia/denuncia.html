<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Mamãe - Denúncia</title>
    <link rel="stylesheet" href="denuncia.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
</head>

<body>

    <header class="header">
        <div class="container">
            <h1 class="logo">Portal Mamãe</h1>
            <nav class="nav">
                <a href="#">Sua agenda</a>
                <a href="#">Home</a>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <div class="container form-container">

            <section class="complaint-form-section">
                <h2 class="section-title">Denúncia</h2>

                <form id="complaintForm">
                    <div class="form-group">
                        <label for="local">Local do ocorrido:</label>
                        <input type="text" id="local" name="local" placeholder="Centro de saúde" required>
                    </div>

                    <div class="form-group">
                        <label for="data">Data:</label>
                        <input type="text" id="data" name="data" placeholder="DD/MM/AAAA" maxlength="10" required>
                    </div>

                    <div class="form-group anonymous-group">
                        <label>Denúncia anônima?</label>
                        <div class="radio-options">

                            <label class="radio-label">
                                <input type="radio" name="anonima" value="sim" checked>
                                <span class="custom-radio"></span>
                                Sim
                            </label>

                            <label class="radio-label">
                                <input type="radio" name="anonima" value="nao">
                                <span class="custom-radio"></span>
                                Não
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="detalhes">O que aconteceu?:</label>
                        <textarea id="detalhes" name="detalhes" rows="8" placeholder="Detalhes da denúncia..."
                            required></textarea>
                    </div>


                    <div class="form-group button-group">
                        <button type="submit" class="submit-button">Enviar Denúncia</button>
                    </div>
                </form>
                <section class="complaint-form-section">
                    <h2 class="section-title">Minhas denúncias</h2>
                    <div id="lista-denuncias">
                        <p>Nenhuma denúncia encontrada.</p>
                    </div>
                </section>

            </section>

            <aside class="illustration-aside">

            </aside>

        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>www.portalmamae.com.br © 2025</p>
        </div>
    </footer>

    <script src="denuncia.js"></script>
</body>

</html>
