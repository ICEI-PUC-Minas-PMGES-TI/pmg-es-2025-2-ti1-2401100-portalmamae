<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Mamãe</title>
  <link rel="stylesheet" href="agendamentos.css">
</head>

<body>
  <div class="container">
    <header>
      <h1>Portal Mamãe</h1>

      <div class="links">
        <a href="/codigo/home/index.html">Home</a>
        <a href="/codigo/gestante/agenda/agendaG.html">Sua Agenda</a>
      </div>
    </header>

    <main>
      <form id="formMamae" class="formulario">

        <label for="cep">CEP</label>
        <input type="text" id="cep" name="cep" placeholder="Digite o CEP" maxlength="9" required>

        <label for="uf">UF</label>
        <input type="text" id="uf" name="uf" readonly>

        <label for="cidade">Cidade</label>
        <input type="text" id="cidade" name="cidade" readonly>

        <label for="rua">Rua</label>
        <input type="text" id="rua" name="rua" readonly>

        <label for="localConsulta">Local da consulta</label>
        <input
          type="text"
          id="localConsulta"
          name="localConsulta"
          placeholder="Ex: Hospital Mater Dei, UBS Centro..."
          required
        >

        <label for="servico">Tipo de serviço</label>
        <input type="text" id="servico" name="servico" required>

        <label for="especialidade">Especialidade</label>
        <input type="text" id="especialidade" name="especialidade" required>

        <div class="agendamento">
          <div class="campo-data">
            <label for="data">Data da consulta</label>
            <input type="date" id="data" name="data" required>
          </div>

          <div class="campo-horario">
            <label for="horario">Horário</label>
            <select id="horario" name="horario" required>
              <option value="">Selecione o horário</option>
            </select>
          </div>
        </div>

        <p>Já possui médico para acompanhamento?</p>
        <div class="opcoes">
          <label>
            <input type="radio" name="acompanhamento" value="Sim" required> Sim
          </label>
          <label>
            <input type="radio" name="acompanhamento" value="Não" required> Não
          </label>
        </div>

        <div id="campoMedico" style="display: none;">
          <label for="nomeMedico">Nome do médico</label>
          <input
            type="text"
            id="nomeMedico"
            name="nomeMedico"
            placeholder="Digite o nome do médico"
          >
        </div>

        <button type="submit">Concluir</button>
      </form>

      <div class="imagem">
        <img src="/codigo/imagens/MedicaeGestante.png" alt="Médica e gestante">
      </div>
    </main>

    <footer>
      <p>www.portalmamae.com.br © 2025</p>
    </footer>
  </div>

  <script src="agendamentos.js"></script>
</body>
</html>
